name: CD - Deploy - Socrates

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - org
        default: 'dev'

concurrency:
  group: deploy-socrates-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  setup-jobs:
    name: Setup Jobs
    runs-on: ubuntu-24.04
    outputs:
      deployment_env: ${{ steps.setup.outputs.deployment_env }}
      tgt_env_short: ${{ steps.setup.outputs.tgt_env_short }}
      stack_name: ${{ steps.setup.outputs.stack_name }}
    steps:
      - name: Setup
        id: setup
        run: |
          ENV="${{ inputs.environment }}"
          echo "Selected environment: $ENV"

          case "$ENV" in
            "org")
              echo "deployment_env=org" >> $GITHUB_OUTPUT
              echo "tgt_env_short=prd" >> $GITHUB_OUTPUT
              echo "stack_name=prd-socrates" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "deployment_env=dev" >> $GITHUB_OUTPUT
              echo "tgt_env_short=stg" >> $GITHUB_OUTPUT
              echo "stack_name=stg-socrates" >> $GITHUB_OUTPUT
              ;;
          esac

  build:
    name: Build & Push
    runs-on: ubuntu-24.04
    needs: setup-jobs
    permissions:
      contents: read
    outputs:
      tagname: ${{ steps.tagname.outputs.tagname }}

    steps:
      - name: Checkout Source Files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a tagname
        id: tagname
        run: |
          tagname=$(git rev-parse --short HEAD)-$(date +%Y%m%d)-$(date +%H%M)
          echo "tagname=$tagname" >> $GITHUB_ENV
          echo "tagname=$tagname" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      - name: Build & Push Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ needs.setup-jobs.outputs.deployment_env }}/socrates:${{ env.tagname }}
            registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ needs.setup-jobs.outputs.deployment_env }}/socrates:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Docker Swarm -- ${{ needs.setup-jobs.outputs.tgt_env_short }}
    runs-on: ubuntu-24.04
    needs: [setup-jobs, build]
    permissions:
      deployments: write
    environment:
      name: ${{ needs.setup-jobs.outputs.tgt_env_short }}-socrates

    steps:
      - name: Setup and connect to Tailscale network
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          hostname: gha-${{ needs.setup-jobs.outputs.tgt_env_short }}-socrates-ci-${{ github.run_id }}
          tags: tag:ci
          version: latest

      - name: Wait for Tailscale Network Readiness
        run: |
          echo "Waiting for Tailscale network to be ready..."
          max_wait=60
          elapsed=0

          while [ $elapsed -lt $max_wait ]; do
            if tailscale status --json | jq -e '.BackendState == "Running"' > /dev/null 2>&1; then
              echo "Tailscale network is ready"
              break
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ $elapsed -ge $max_wait ]; then
            echo "Tailscale network not ready after ${max_wait}s"
            exit 1
          fi

      - name: Trigger Gantry via Webhook
        env:
          WEBHOOK_HOST: ${{ secrets.WEBHOOK_HOST }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          STACK_NAME: ${{ needs.setup-jobs.outputs.stack_name }}
        run: |
          curl -fsS -X POST "https://$WEBHOOK_HOST/hooks/run-gantry" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "{\"GANTRY_SERVICES_FILTERS\":\"name=${STACK_NAME}_svc-socrates\"}"
