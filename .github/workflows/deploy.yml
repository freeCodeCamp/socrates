name: CD - Deploy - Socrates

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - org
        default: 'dev'
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      build_version:
        description: 'Release identifier (image tag) used by sentry-cli deploy marker'
        type: string
        required: false
        default: ''
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      WEBHOOK_HOST:
        required: true
      WEBHOOK_SECRET:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false

concurrency:
  group: deploy-socrates-${{ github.event.inputs.environment || inputs.environment }}
  cancel-in-progress: false

jobs:
  setup-jobs:
    name: Setup Jobs
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      deployment_env: ${{ steps.setup.outputs.deployment_env }}
      tgt_env_short: ${{ steps.setup.outputs.tgt_env_short }}
      stack_name: ${{ steps.setup.outputs.stack_name }}
    steps:
      - name: Setup
        id: setup
        env:
          SELECTED_ENV: ${{ inputs.environment }}
        run: |
          ENV="$SELECTED_ENV"
          echo "Selected environment: $ENV"

          case "$ENV" in
            "org")
              echo "deployment_env=org" >> "$GITHUB_OUTPUT"
              echo "tgt_env_short=prd" >> "$GITHUB_OUTPUT"
              echo "stack_name=prd-socrates" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "deployment_env=dev" >> "$GITHUB_OUTPUT"
              echo "tgt_env_short=stg" >> "$GITHUB_OUTPUT"
              echo "stack_name=stg-socrates" >> "$GITHUB_OUTPUT"
              ;;
          esac

  deploy:
    name: Deploy -- ${{ needs.setup-jobs.outputs.tgt_env_short }}
    runs-on: ubuntu-24.04
    needs: setup-jobs
    permissions:
      deployments: write
    environment:
      name: ${{ needs.setup-jobs.outputs.tgt_env_short }}-socrates

    steps:
      - name: Setup and connect to Tailscale network
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          hostname: gha-${{ needs.setup-jobs.outputs.tgt_env_short }}-socrates-ci-${{ github.run_id }}
          tags: tag:ci
          version: latest

      - name: Wait for Tailscale Network Readiness
        run: |
          echo "Waiting for Tailscale network to be ready..."
          max_wait=60
          elapsed=0

          while [ $elapsed -lt $max_wait ]; do
            if tailscale status --json | jq -e '.BackendState == "Running"' > /dev/null 2>&1; then
              echo "Tailscale network is ready"
              break
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ $elapsed -ge $max_wait ]; then
            echo "Tailscale network not ready after ${max_wait}s"
            exit 1
          fi

      - name: Trigger Gantry via Webhook
        env:
          WEBHOOK_HOST: ${{ secrets.WEBHOOK_HOST }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          STACK_NAME: ${{ needs.setup-jobs.outputs.stack_name }}
        run: |
          curl -fsS -X POST "https://$WEBHOOK_HOST/hooks/run-gantry" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "{\"GANTRY_SERVICES_FILTERS\":\"name=${STACK_NAME}_svc-socrates\"}"

      - name: Install sentry-cli
        if: inputs.build_version != '' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm install -g @sentry/cli@3.4.3

      - name: Sentry — deploy marker
        if: inputs.build_version != '' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          BUILD_VERSION: ${{ inputs.build_version }}
          DEPLOY_ENV: ${{ needs.setup-jobs.outputs.tgt_env_short }}
        run: sentry-cli deploys new -e "$DEPLOY_ENV" -r "$BUILD_VERSION"
