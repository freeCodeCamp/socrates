name: CD - Deploy - Socrates

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - org
        default: 'dev'
      deployment_version:
        description: 'Image tag to deploy'
        type: string
        default: 'latest'
      deploy_mode:
        description: 'Deploy mode'
        type: choice
        options:
          - gantry
          - full
        default: 'gantry'
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      deployment_version:
        type: string
        required: true
      deploy_mode:
        type: string
        required: true
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      WEBHOOK_HOST:
        required: false
      WEBHOOK_SECRET:
        required: false
      TS_USERNAME:
        required: false
      TS_MACHINE_NAME:
        required: false

concurrency:
  group: deploy-socrates-${{ github.event.inputs.environment || inputs.environment }}
  cancel-in-progress: false

jobs:
  setup-jobs:
    name: Setup Jobs
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      deployment_env: ${{ steps.setup.outputs.deployment_env }}
      tgt_env_short: ${{ steps.setup.outputs.tgt_env_short }}
      stack_name: ${{ steps.setup.outputs.stack_name }}
    steps:
      - name: Validate deploy_mode
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
        run: |
          if [[ "$DEPLOY_MODE" != "gantry" && "$DEPLOY_MODE" != "full" ]]; then
            echo "ERROR: Invalid deploy_mode '$DEPLOY_MODE'. Must be 'gantry' or 'full'."
            exit 1
          fi

      - name: Setup
        id: setup
        env:
          SELECTED_ENV: ${{ inputs.environment }}
        run: |
          ENV="$SELECTED_ENV"
          echo "Selected environment: $ENV"

          case "$ENV" in
            "org")
              echo "deployment_env=org" >> $GITHUB_OUTPUT
              echo "tgt_env_short=prd" >> $GITHUB_OUTPUT
              echo "stack_name=prd-socrates" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "deployment_env=dev" >> $GITHUB_OUTPUT
              echo "tgt_env_short=stg" >> $GITHUB_OUTPUT
              echo "stack_name=stg-socrates" >> $GITHUB_OUTPUT
              ;;
          esac

  deploy-gantry:
    name: Deploy via Gantry -- ${{ needs.setup-jobs.outputs.tgt_env_short }}
    if: inputs.deploy_mode == 'gantry'
    runs-on: ubuntu-24.04
    needs: setup-jobs
    permissions:
      deployments: write
    environment:
      name: ${{ needs.setup-jobs.outputs.tgt_env_short }}-socrates

    steps:
      - name: Setup and connect to Tailscale network
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          hostname: gha-${{ needs.setup-jobs.outputs.tgt_env_short }}-socrates-ci-${{ github.run_id }}
          tags: tag:ci
          version: latest

      - name: Wait for Tailscale Network Readiness
        run: |
          echo "Waiting for Tailscale network to be ready..."
          max_wait=60
          elapsed=0

          while [ $elapsed -lt $max_wait ]; do
            if tailscale status --json | jq -e '.BackendState == "Running"' > /dev/null 2>&1; then
              echo "Tailscale network is ready"
              break
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ $elapsed -ge $max_wait ]; then
            echo "Tailscale network not ready after ${max_wait}s"
            exit 1
          fi

      - name: Trigger Gantry via Webhook
        env:
          WEBHOOK_HOST: ${{ secrets.WEBHOOK_HOST }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          STACK_NAME: ${{ needs.setup-jobs.outputs.stack_name }}
        run: |
          curl -fsS -X POST "https://$WEBHOOK_HOST/hooks/run-gantry" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "{\"GANTRY_SERVICES_FILTERS\":\"name=${STACK_NAME}_svc-socrates\"}"

  deploy-full:
    name: Deploy via SSH -- ${{ needs.setup-jobs.outputs.tgt_env_short }}
    if: inputs.deploy_mode == 'full'
    runs-on: ubuntu-24.04
    needs: setup-jobs
    env:
      TS_USERNAME: ${{ secrets.TS_USERNAME }}
      TS_MACHINE_NAME: ${{ secrets.TS_MACHINE_NAME }}
    permissions:
      deployments: write
    environment:
      name: ${{ needs.setup-jobs.outputs.tgt_env_short }}-socrates

    steps:
      - name: Setup and connect to Tailscale network
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          hostname: gha-${{ needs.setup-jobs.outputs.tgt_env_short }}-socrates-ci-${{ github.run_id }}
          tags: tag:ci
          version: latest

      - name: Wait for Tailscale Network Readiness
        run: |
          echo "Waiting for Tailscale network to be ready..."
          max_wait=60
          elapsed=0

          while [ $elapsed -lt $max_wait ]; do
            if tailscale status --json | jq -e '.BackendState == "Running"' > /dev/null 2>&1; then
              echo "Tailscale network is ready"
              break
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ $elapsed -ge $max_wait ]; then
            echo "Tailscale network not ready after ${max_wait}s"
            exit 1
          fi

      - name: Configure SSH & Check Connection
        run: |
          mkdir -p ~/.ssh
          echo "Host *
            UserKnownHostsFile=/dev/null
            StrictHostKeyChecking no" > ~/.ssh/config
          chmod 644 ~/.ssh/config

          validate_connection() {
            local machine_name=$1
            local max_retries=3
            local retry_delay=5

            for attempt in $(seq 1 $max_retries); do
              echo "Connection attempt $attempt/$max_retries to $machine_name"

              if ! tailscale status | grep -q "$machine_name"; then
                echo "Machine $machine_name not found in Tailscale network"
                if [ $attempt -eq $max_retries ]; then
                  return 1
                fi
                sleep $retry_delay
                continue
              fi

              MACHINE_IP=$(tailscale ip -4 $machine_name)
              if ssh -o ConnectTimeout=10 -o BatchMode=yes $TS_USERNAME@$MACHINE_IP "echo 'Connection test'; docker --version" > /dev/null 2>&1; then
                echo "Successfully validated connection to $machine_name"
                return 0
              fi

              echo "SSH validation failed for $machine_name"
              if [ $attempt -lt $max_retries ]; then
                sleep $retry_delay
              fi
            done

            echo "Failed to establish connection to $machine_name after $max_retries attempts"
            return 1
          }

          echo -e "\nLOG:Validating connection to $TS_MACHINE_NAME..."
          if ! validate_connection "$TS_MACHINE_NAME"; then
            echo "Error: Failed to establish reliable connection to $TS_MACHINE_NAME"
            exit 1
          fi

      - name: Deploy with Docker Stack
        env:
          # Variables set from GitHub "Environment" secrets
          # DOCKER_REGISTRY
          # API_KEY
          # GROQ_API_KEY
          # Variables set from workflow inputs/setup
          DEPLOYMENT_VERSION: ${{ inputs.deployment_version }}
          DEPLOYMENT_ENV: ${{ needs.setup-jobs.outputs.deployment_env }}
          STACK_NAME: ${{ needs.setup-jobs.outputs.stack_name }}
        run: |
          REMOTE_SCRIPT="
            set -e
            echo -e '\nLOG:Deploying Socrates to $TS_MACHINE_NAME...'
            cd /home/$TS_USERNAME/infra/docker/swarm/stacks/socrates

            echo -e '\nLOG:Setting environment variables...'
            export DOCKER_REGISTRY=$DOCKER_REGISTRY
            export API_KEY=$API_KEY
            export GROQ_API_KEY=$GROQ_API_KEY
            export DEPLOYMENT_VERSION=$DEPLOYMENT_VERSION
            export DEPLOYMENT_ENV=$DEPLOYMENT_ENV

            REQUIRED_VARS=(
              \"DOCKER_REGISTRY\"
              \"API_KEY\"
              \"GROQ_API_KEY\"
              \"DEPLOYMENT_VERSION\"
              \"DEPLOYMENT_ENV\"
            )

            MISSING_VARS=()
            for var in \"\${REQUIRED_VARS[@]}\"; do
              if [[ -z \"\${!var}\" ]]; then
                MISSING_VARS+=(\"\$var\")
              fi
            done

            if [[ \${#MISSING_VARS[@]} -gt 0 ]]; then
              echo \"ERROR: The following required environment variables are missing or empty:\"
              for var in \"\${MISSING_VARS[@]}\"; do
                echo \"  - \$var\"
              done
              exit 1
            fi

            echo -e '\nLOG:Validating deployment version...'
            if [[ \"\$DEPLOYMENT_VERSION\" != \"$DEPLOYMENT_VERSION\" ]]; then
              echo \"Error: Version mismatch. Expected: $DEPLOYMENT_VERSION, Got: \$DEPLOYMENT_VERSION\"
              exit 1
            fi
            env | grep -E 'DEPLOYMENT_VERSION|DEPLOYMENT_ENV'

            echo -e '\nLOG:Checking stack configuration...'
            docker stack config -c stack-socrates.yml > /dev/null

            echo -e '\nLOG:Deploying stack...'
            docker stack deploy -c stack-socrates.yml --with-registry-auth --detach=false $STACK_NAME

            echo -e '\nLOG:Finished deployment.'
          "
          MACHINE_IP=$(tailscale ip -4 $TS_MACHINE_NAME)
          ssh $TS_USERNAME@$MACHINE_IP "$REMOTE_SCRIPT"
