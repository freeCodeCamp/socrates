name: CD - Build - Socrates

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - org
        default: 'dev'
      deploy_mode:
        description: 'Deploy mode after build'
        type: choice
        options:
          - skip
          - gantry
          - full
        default: 'skip'

concurrency:
  group: build-socrates-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  setup-jobs:
    name: Setup Jobs
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      deployment_env: ${{ steps.setup.outputs.deployment_env }}
      tgt_env_short: ${{ steps.setup.outputs.tgt_env_short }}
      stack_name: ${{ steps.setup.outputs.stack_name }}
    steps:
      - name: Setup
        id: setup
        env:
          SELECTED_ENV: ${{ inputs.environment }}
        run: |
          ENV="$SELECTED_ENV"
          echo "Selected environment: $ENV"

          case "$ENV" in
            "org")
              echo "deployment_env=org" >> $GITHUB_OUTPUT
              echo "tgt_env_short=prd" >> $GITHUB_OUTPUT
              echo "stack_name=prd-socrates" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "deployment_env=dev" >> $GITHUB_OUTPUT
              echo "tgt_env_short=stg" >> $GITHUB_OUTPUT
              echo "stack_name=stg-socrates" >> $GITHUB_OUTPUT
              ;;
          esac

  build:
    name: Build & Push
    runs-on: ubuntu-24.04
    needs: setup-jobs
    permissions:
      contents: read
    outputs:
      tagname: ${{ steps.tagname.outputs.tagname }}

    steps:
      - name: Checkout Source Files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a tagname
        id: tagname
        run: |
          tagname=$(git rev-parse --short HEAD)-$(date +%Y%m%d)-$(date +%H%M)
          echo "tagname=$tagname" >> $GITHUB_ENV
          echo "tagname=$tagname" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      - name: Build & Push Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ needs.setup-jobs.outputs.deployment_env }}/socrates:${{ env.tagname }}
            registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ needs.setup-jobs.outputs.deployment_env }}/socrates:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    if: inputs.deploy_mode != 'skip'
    needs: [setup-jobs, build]
    permissions:
      deployments: write
    uses: ./.github/workflows/cd-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      deployment_version: ${{ needs.build.outputs.tagname }}
      deploy_mode: ${{ inputs.deploy_mode }}
    secrets: inherit
